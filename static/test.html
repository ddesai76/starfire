const SIGNET_AVAILABLE = __SIGNET_AVAILABLE__;

// `var` (not `let`) so that external write reaches this binding.

let card = {
  id: "TC-001", title: "Untitled Test Card", revision: "A", author: "",
  date: new Date().toISOString().slice(0,10), project: "", test_conductor: "",
  quality_assurance: "", system: "", subsystem: "", test_type: "", article: "", requirements: "",
  points: [], nomenclature: [], references: [], notes: [], warnings: [], locked: false,
  files_migrated: true
};

const metaFields = ["id","title","revision","author","date","project","test_conductor","quality_assurance","test_type","article","requirements"];
const ALWAYS_EDITABLE_META = new Set(["test_conductor", "quality_assurance", "date", "article"]);
function bindMeta() {
  metaFields.forEach(f => {
    const el = document.getElementById("m-" + f);
    el.value = card[f] ?? "";
    el.disabled = !!card.locked && !ALWAYS_EDITABLE_META.has(f);
    el.addEventListener("input", () => { card[f] = el.value; });
  });
  const sysEl = document.getElementById("m-system");
  sysEl.value = [card.system, card.subsystem].filter(Boolean).join(" / ");
  sysEl.disabled = !!card.locked;
  sysEl.addEventListener("input", () => {
    const parts = sysEl.value.split("/").map(s => s.trim());
    card.system = parts[0] || ""; card.subsystem = parts[1] || "";
  });
}

function nextSeq() {
  const max = card.points.reduce((m, p) => Math.max(m, +p.seq || 0), 0);
  return Math.floor(max / 10) * 10 + 10;
}

// Number for a copy of point i, which goes right below it: the midpoint of the gap to the
// next point if there is one (20, 30 -> 25), else the lowest unused number above it.
function duplicateSeq(points, i) {
  const used = new Set(points.map(p => +p.seq));
  const s = +points[i].seq, n = i + 1 < points.length ? +points[i + 1].seq : NaN;
  const mid = Math.floor((s + n) / 2);
  if (n - s > 1 && !used.has(mid)) return mid;
  if (isNaN(n) || n <= s) { const next = nextSeq(); if (!used.has(next) && next > s) return next; }
  let k = s + 1;
  while (used.has(k)) k++;
  return k;
}

// A copy of point i with only its procedure kept (not results, sign-off, photos or files).
function duplicatePoint(i) {
  const src = card.points[i];
  card.points.splice(i + 1, 0, {seq: duplicateSeq(card.points, i), action: src.action, expected: src.expected,
                     observed: "", reference: src.reference, responsible_party: src.responsible_party,
                     date: "", time: "", initial: "", quality: "", locked: false, flagged: false, images: [], files: [],
                     parameters: (src.parameters || []).map(r => [...r]), signals: src.signals || "", runs: {},
                     module: src.module || "", args: src.args || ""});
}

const QUALITY_OPTIONS = [
  ["", "[None]"],
  ["RFI", "🔵 RFI"],
  ["PASS", "🟢 PASS"],
  ["CAUTION", "🟠 CAUTION"],
  ["FAIL", "🔴 FAIL"],
];
function qualitySelect(i, current) {
  const opts = QUALITY_OPTIONS.map(([v, label]) =>
    `<option value="${v}"${v === current ? " selected" : ""}>${label}</option>`).join("");
  return `<select data-i="${i}" data-f="quality">${opts}</select>`;
}

// One camera stream shared across all points, acquired once via
// getUserMedia() -- reaches any UVC-class video device the OS exposes.
let cameraStream = null;
let cameraVideo = null;
let cameraCanvas = null;
let previewOpenIndex = null;

function ensureCameraElements() {
  if (!cameraVideo) {
    cameraVideo = document.createElement("video");
    cameraVideo.autoplay = true;
    cameraVideo.muted = true;
    cameraVideo.playsInline = true;
    cameraVideo.className = "cam-preview";
  }
  if (!cameraCanvas) cameraCanvas = document.createElement("canvas");
}

async function ensureCameraStream() {
  if (cameraStream) return cameraStream;
  ensureCameraElements();
  cameraStream = await navigator.mediaDevices.getUserMedia({video: true});
  cameraVideo.srcObject = cameraStream;
  return cameraStream;
}

function reattachPreviewIfOpen() {
  if (previewOpenIndex === null) return;
  const slot = document.getElementById("pt-camera-" + previewOpenIndex);
  if (slot && cameraVideo) slot.appendChild(cameraVideo);
}

function showCamMessage(i, text) {
  const el = document.getElementById("pt-cam-msg-" + i);
  if (!el) return;
  el.textContent = text;
  setTimeout(() => { if (el.textContent === text) el.textContent = ""; }, 4000);
}

async function capturePointImage(i) {
  try {
    await ensureCameraStream();
  } catch (err) {
    showCamMessage(i, "No camera available");
    return;
  }
  const w = cameraVideo.videoWidth, h = cameraVideo.videoHeight;
  if (!w || !h) { showCamMessage(i, "Camera not ready yet -- try again"); return; }
  cameraCanvas.width = w; cameraCanvas.height = h;
  cameraCanvas.getContext("2d").drawImage(cameraVideo, 0, 0, w, h);
  const dataUrl = cameraCanvas.toDataURL("image/jpeg", 0.9);
  try {
    const res = await fetch("/capture_image", {method: "POST", body: JSON.stringify({data: dataUrl})});
    const result = await res.json();
    if (!result.saved) throw new Error(result.error || "unknown error");
    card.points[i].images = card.points[i].images || [];
    card.points[i].images.push(result.filename);
    renderPoints();
    showCamMessage(i, "Captured " + result.filename);
  } catch (err) {
    showCamMessage(i, "Capture failed: " + err);
  }
}

async function createJiraTicket(i) {
  const p = card.points[i];
  const msgEl = document.getElementById("pt-jira-msg-" + i);
  if (msgEl) msgEl.innerHTML = "Creating ticket...";
  const summary = `${card.id} pt ${p.seq}: ${(p.action || "(no action text)").slice(0, 120)}`;
  const description = [
    `Test: ${card.id} -- ${card.title}`,
    `Point ${p.seq}`,
    `Action: ${p.action || ""}`,
    `Expected: ${p.expected || ""}`,
    `Observed: ${p.observed || ""}`,
    `Reference: ${p.reference || ""}`,
    `Quality: ${p.quality || ""}`,
  ].join("\n");
  try {
    const res = await fetch("/create_jira_ticket", {
      method: "POST",
      body: JSON.stringify({summary, description, epic_key: starfireJiraEpicKey || ""}),
    });
    const result = await res.json();
    if (!msgEl) return;
    if (result.success) {
      msgEl.innerHTML = `Created <a href="${esc(result.url)}" target="_blank" rel="noopener">${esc(result.key)}</a>`;
    } else {
      msgEl.textContent = `Ticket creation failed: ${result.error || "unknown error"}`;
    }
  } catch (err) {
    if (msgEl) msgEl.textContent = `Ticket creation failed: ${err}`;
  }
}

function togglePreview(i) {
  if (previewOpenIndex === i) {
    if (cameraVideo && cameraVideo.parentElement) cameraVideo.parentElement.removeChild(cameraVideo);
    previewOpenIndex = null;
    return;
  }
  ensureCameraStream().then(() => {
    const slot = document.getElementById("pt-camera-" + i);
    if (cameraVideo.parentElement) cameraVideo.parentElement.removeChild(cameraVideo);
    slot.appendChild(cameraVideo);
    previewOpenIndex = i;
  }).catch(() => {
    showCamMessage(i, "No camera available");
  });
}

// Measure (gauge): a live view of the point's signals -- its modules' outputs and the
// signals its Signet code connects in. Nothing is saved; each open reads them again.
const measureState = new WeakMap();
function measureIsOpen(p) { return !!(measureState.get(p) || {}).open; }

function toggleMeasure(i) {
  const p = card.points[i], st = measureState.get(p) || {};
  st.open = !st.open;
  measureState.set(p, st);
  renderPoints();
  if (st.open) loadMeasure(i);
}

async function loadMeasure(i) {
  const p = card.points[i], st = measureState.get(p);
  if (!st || !st.open || !SIGNET_AVAILABLE) return;
  try {
    const res = await fetch("/point_signals", {method: "POST", body: JSON.stringify(
      {card, campaign: pointCampaign() || "XX-000", point: p.seq, live: campaignLive()})});
    const r = await res.json();
    st.list = r.signals || [];
    st.error = r.error || "";
  } catch (err) {
    st.list = [];
    st.error = String(err);
  }
  if (!st.list.some(s => s.file === st.file)) st.file = (st.list[0] || {}).file || "";
  await showMeasure(i);
}

async function showMeasure(i) {
  const p = card.points[i], st = measureState.get(p);
  st.value = null;
  if (st.file) {
    try {
      st.value = await (await fetch("/signal_value?file=" + encodeURIComponent(st.file))).json();
    } catch (err) {
      st.value = {error: String(err)};
    }
  }
  const el = document.getElementById("pt-measure-" + i);
  if (el) { el.innerHTML = measurePanelHtml(i, p); bindMeasurePanel(i); }
}

function measurePanelHtml(i, p) {
  const st = measureState.get(p) || {};
  if (!st.open) return "";
  if (!SIGNET_AVAILABLE) return `<div class="module-status failed">Signals are off: this Starfire was built without Signet.</div>`;
  if (!st.list) return `<div class="hint">Reading signals...</div>`;
  const v = st.value;
  let body = "";
  if (!st.list.length) body = `<div class="hint">No signals on this point yet: run a module, or connect one in the Signals box.</div>`;
  else if (!v) body = "";
  else if (v.error) body = `<div class="calc-out err">${esc(v.error)}</div>`;
  else if (v.scalar) body = `<div class="calc-out">${esc(v.text)}</div>`;
  else if (v.head) body = `<div class="calc-out arr">${v.head.map(esc).join("<br>")}${v.count > v.head.length ? `<br>... ${v.count} entries` : ""}</div>`;
  else body = `<div class="calc-out arr">${esc(v.text)}</div>`;
  const group = (role, title) => {
    const opts = st.list.filter(s => s.role === role)
      .map(s => `<option value="${esc(s.file)}"${s.file === st.file ? " selected" : ""}>${esc(s.label)}</option>`).join("");
    return opts ? `<optgroup label="${title}">${opts}</optgroup>` : "";
  };
  return `
    <label>Signal</label>
    <div class="send-row">
      <select data-measfile="${i}"${st.list.length ? "" : " disabled"}>${group("out", "Outputs")}${group("in", "Inputs")}</select>
      <button class="btn mini" data-measrefresh="${i}" title="read the point's signals again">refresh</button>
    </div>
    ${v && v.type ? `<div class="hint">${esc(v.type)}${v.generated ? " | " + esc(v.generated) : ""}</div>` : ""}
    ${body}
    <div class="module-status failed">${esc(st.error || "")}</div>`;
}

function bindMeasurePanel(i) {
  const root = document.getElementById("pt-measure-" + i);
  if (!root) return;
  const st = measureState.get(card.points[i]);
  root.querySelector("select[data-measfile]")?.addEventListener("change", e => { st.file = e.target.value; showMeasure(i); });
  root.querySelector("button[data-measrefresh]")?.addEventListener("click", () => loadMeasure(i));
}

// Modules (Activate / bolt): scripts or binaries in dist/ that the campaign's
// Modules table registers. The registry is read live from the campaign page
// we're embedded in; a standalone card has none, so nothing can be run.
// Panel-open and run state are transient (never saved) and keyed by the point
// object, so they follow a point when it's moved up or down.
const moduleState = new WeakMap();

function campaignModules() {
  try {
    return (window.parent !== window && window.parent.getCampaignModules) ? window.parent.getCampaignModules() : [];
  } catch (e) { return []; }
}

// Scope "" = any point; "TC-001" = any point on that card; "TC-001-20" = that point only.
function moduleInScope(m, cardId, seq) {
  const s = (m.scope || "").trim().toLowerCase();
  if (!s) return true;
  const id = (cardId || "").trim().toLowerCase();
  return s === id || s === id + "-" + seq;
}

// The campaign's live list, [{card, point, file}], for Signet code.
function campaignLive() {
  try { return (window.parent !== window && window.parent.getCampaignLive) ? window.parent.getCampaignLive() : []; } catch (e) { return []; }
}
function canSetLive() {
  try { return SIGNET_AVAILABLE && window.parent !== window && !!window.parent.setCampaignLive; } catch (e) { return false; }
}
function isLive(p, fn) {
  return campaignLive().some(e => e.card === card.id && String(e.point) === String(p.seq) && e.file === fn);
}
function setLive(p, fn, on) {

  }
  st.active = mod;
  runModule(p, mod);
}

// Signet syntax colours for the Signals box: a coloured copy of the text sits behind the (transparent) textarea.
const SIG_COMMANDS = new Set(("let where connect if then else end break multiplex demultiplex echo output run when within by finish delay " +
  "escape for next index route exit merge interchange complete failed broken running column function subprocess return map warp unity input Re Im abs arg conj power root").split(" "));
const SIG_FILE = /\.(sig|csv|txt|tsv|json|png|jpe?g|gif)$/;   // a signal or file reference, not module.port or a parameter
const SIG_TOKEN = new RegExp([
  "(#.*)", "('[^'\\n]*'|\"[^\"\\n]*\")", "((?:[A-Za-z_]\\w*::)+)", "((?<=hex::)(?:0[xX])?[0-9A-Fa-f]+(?![A-Za-z0-9_]))",
  "([A-Za-z0-9_-]+:\\$?[A-Za-z_][\\w.-]*)", "((?:\\d+\\.?\\d*|\\.\\d+)(?:[eE][+-]?\\d+)?(?![A-Za-z0-9_.]))",
  "([A-Za-z0-9_-]+(?:\\.[A-Za-z0-9_-]+)*\\.[A-Za-z0-9_-]*[A-Za-z][A-Za-z0-9_-]*)", "(\\$[A-Za-z_]\\w*)", "([A-Za-z_]\\w*)"].join("|"), "g");
function sigHtml(text) {
  let out = "", at = 0;
  const put = (s, cls) => { s = esc(s); out += cls ? `<span class="${cls}">${s}</span>` : s; };
  for (const m of text.matchAll(SIG_TOKEN)) {
    put(text.slice(at, m.index));
    const w = m[0].toLowerCase();
    put(m[0], m[1] ? "sg-c" : m[2] ? "sg-s" : m[3] ? "sg-t" : m[4] || m[6] ? "sg-n" : m[9] ? (w === "true" || w === "false" ? "sg-n"
              : SIG_COMMANDS.has(w) ? "sg-k" : /^(and|or|not)$/.test(w) ? "" : "sg-v") : SIG_FILE.test(w) ? (w.endsWith(".sig") ? "sg-g" : "sg-f") : "sg-v");
    at = m.index + m[0].length;
  }
  put(text.slice(at));
  return out + "\n";
}
function sigSync(ta, hl) { hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft; }

// Parameters -> Arguments: each becomes "--name value", replacing a --name line already there, else added at the top.
function paramsToArgs(p, args) {
  const q = v => /^[A-Za-z0-9_@%+=:,.\/-]+$/.test(v) ? v : "'" + v.replace(/'/g, "'\\''") + "'";
  const lines = (args || "").split("\n"), added = [];
  (p.parameters || []).filter(([n]) => (n || "").trim()).forEach(([n, v]) => {
    const name = n.trim(), line = `--${name} ${q(v ?? "")}`;
    const re = new RegExp("^\\s*--" + name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(\\s|=|$)");
    const at = lines.findIndex(l => re.test(l));
    if (at >= 0) lines[at] = line; else added.push(line);
  });
  return [...added, ...lines].join("\n").replace(/\n+$/, "");
}

function bindModulePanel(i) {
  const root = document.getElementById("pt-module-" + i);
  if (!root) return;
  const p = card.points[i];
  const inp = root.querySelector("input[data-modname]");
  if (inp) inp.addEventListener("input", () => { if (!p.locked) p.module = inp.value; schedulePortMap(); });
  const argsInp = root.querySelector("textarea[data-modargs]");
  if (argsInp) argsInp.addEventListener("input", () => { if (!p.locked) p.args = argsInp.value; });
  const sigInp = root.querySelector("textarea[data-modsig]");
  if (sigInp) {
    const hl = sigInp.parentElement.querySelector(".sig-hl");
    sigInp.addEventListener("input", () => { if (!p.locked) p.signals = sigInp.value; hl.innerHTML = sigHtml(sigInp.value); sigSync(sigInp, hl); schedulePortMap(); });
    sigInp.addEventListener("scroll", () => sigSync(sigInp, hl));
    new ResizeObserver(() => sigSync(sigInp, hl)).observe(sigInp);
  }
  root.querySelectorAll("input[data-pname], input[data-pval]").forEach(el => el.addEventListener("input", () => {
    const named = el.dataset.pname != null;
    p.parameters[+(named ? el.dataset.pname : el.dataset.pval)][named ? 0 : 1] = el.value;
  }));
  const padd = root.querySelector("button[data-padd]");
  if (padd) padd.addEventListener("click", () => { (p.parameters ||= []).push(["", ""]); refreshModulePanel(p); });
  root.querySelectorAll("button[data-pdel]").forEach(b => b.addEventListener("click", () => {
    if (p.locked) return;
    p.parameters.splice(+b.dataset.pdel, 1);
    refreshModulePanel(p);
  }));
  const pcopy = root.querySelector("button[data-pcopy]");
  if (pcopy) pcopy.addEventListener("click", () => {
    if (p.locked) return;
    p.args = paramsToArgs(p, p.args);
    refreshModulePanel(p);
  });
  const btn = root.querySelector("button[data-modrun]");
  if (btn) btn.addEventListener("click", () => { (moduleState.get(p) || {}).active = ""; runModule(p); });
  const brk = root.querySelector("button[data-modbreak]");
  if (brk) brk.addEventListener("click", () => breakModule(p));
  // input() in a sequence: send the answer
  const ans = root.querySelector("input[data-seqans]"), send = root.querySelector("button[data-seqsend]");
  const answer = async () => {
    const st = moduleState.get(p) || {};
    const r = await fetch("/seq_answer", {method: "POST", body: JSON.stringify({card: card.id, point: p.seq, answer: ans.value})});
    if (r.ok) { st.question = null; refreshModulePanel(p); }
    else { st.text = `answer refused: ${(await r.json()).error}`; refreshModulePanel(p); }
  };
  if (send) send.addEventListener("click", answer);
  if (ans) ans.addEventListener("keydown", e => { if (e.key === "Enter") answer(); });
  bindConn(i);
}

// Redraws just this point's module panel (not the whole list) so a run
// finishing doesn't steal focus from whatever the person is typing elsewhere.
// Calculator: math and metrics on one of the point's csv files (see calculate() in starfire.py).
// Transient like the module panel: {open, file, exprs, results, columns, error}, keyed by the point.
const calcState = new WeakMap();
function calcIsOpen(p) { return !!(calcState.get(p) || {}).open; }

function calcFiles(p) {
  return (p.files || []).filter(n => /\.(csv|txt)$/i.test(n) && !/-VAL\.txt$/i.test(n));
}

function calcPanelHtml(i, p) {
  const st = calcState.get(p), files = calcFiles(p);
  if (!files.length) return `<div class="pt-cam-msg">No csv on this point. Run a module or add a file first.</div>`;
  if (!st.file || !files.includes(st.file)) { st.file = files[0]; st.columns = null; }
  const chips = (st.columns || []).map(c => `<button class="btn mini calc-chip" data-calccol="${i}" data-name="${esc(c)}" title="insert @${esc(c)}">@${esc(c)}</button>`).join("");
  const rows = st.exprs.map((e, j) => `
    <div class="calc-row">
      <input data-calcexpr="${i}" data-j="${j}" value="${esc(e)}" spellcheck="false">
      <div class="calc-out" id="pt-calcout-${i}-${j}"></div>
    </div>`).join("");
  return `
    <div class="send-row mod-row">
      <div><label>File</label>
      <select data-calcfile="${i}">${files.map(n => `<option${n === st.file ? " selected" : ""}>${esc(n)}</option>`).join("")}</select></div>
      <button class="btn mini" data-calcclear="${i}" title="clear all expressions and results">AC</button>
    </div>
    <div class="calc-chips">${chips}</div>
    ${rows}
    <div class="module-status failed" id="pt-calcmsg-${i}">${esc(st.error || "")}</div>`;
}

function showCalc(i) {
  const st = calcState.get(card.points[i]);
  const msg = document.getElementById("pt-calcmsg-" + i);
  if (msg) msg.textContent = st.error || "";
  st.exprs.forEach((_, j) => {
    const out = document.getElementById(`pt-calcout-${i}-${j}`);
    const r = (st.results || [])[j];
    if (!out) return;
    out.className = "calc-out" + (r && r.error ? " err" : r && r.value.includes("samples") ? " arr" : "");
    out.textContent = r ? (r.error || r.value) : "";
  });
}

// One request evaluates every non-empty row; /calc skips empty ones, so results are matched back by expression.
async function runCalc(i) {
  const p = card.points[i], st = calcState.get(p);
  try {
    const res = await fetch("/calc", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({campaign: pointCampaign() || "XX-000", card: card.id, file: st.file, exprs: st.exprs}),
    });
    const r = await res.json();
    st.error = r.error || "";
    if (r.error) st.results = [];
    else {
      const by = new Map(r.results.map(x => [x.expr, x]));
      st.results = st.exprs.map(e => by.get(e));
      if (!st.columns) { st.columns = r.columns; renderPoints(); return; }
    }
  } catch (err) {
    st.error = `Calculator failed: ${err}`;
  }
  showCalc(i);
}

function bindCalcPanel(i) {
  const root = document.getElementById("pt-calc-" + i);
  const p = card.points[i], st = calcState.get(p);
  if (!root || !st || !st.open || !root.firstElementChild || root.querySelector("select") === null) return;
  let timer = null, last = null;
  const later = () => { clearTimeout(timer); timer = setTimeout(() => runCalc(i), 250); };
  root.querySelector("select").addEventListener("change", e => {
    st.file = e.target.value; st.columns = null; st.results = null; renderPoints();
  });
  root.querySelector("[data-calcclear]").addEventListener("click", () => {
    st.exprs = [""]; st.results = []; st.error = ""; renderPoints();
  });
  root.querySelectorAll("input[data-calcexpr]").forEach(inp => {
    inp.addEventListener("input", () => { st.exprs[+inp.dataset.j] = inp.value; later(); });
    inp.addEventListener("focus", () => { last = inp; });
  });
  root.querySelectorAll("[data-calccol]").forEach(btn => btn.addEventListener("click", () => {
    const inp = last || root.querySelector("input[data-calcexpr]");
    inp.value += (inp.value && !/[\s(]$/.test(inp.value) ? " " : "") + "@" + btn.dataset.name;
    st.exprs[+inp.dataset.j] = inp.value; inp.focus(); later();
  }));
  if (!st.results) { runCalc(i); } else { showCalc(i); }
}

function moduleIsOpen(p) { return !!(moduleState.get(p) || {}).open; }

function refreshModulePanel(p) {
  const i = card.points.indexOf(p);
  const root = document.getElementById("pt-module-" + i);
  if (!root || !moduleIsOpen(p)) return;
  const ans = root.querySelector("input[data-seqans]");
  if (ans && document.activeElement === ans && (moduleState.get(p) || {}).question) return;   // don't redraw under someone answering
  root.innerHTML = modulePanelHtml(i, p);
  bindModulePanel(i);
  refreshPins(p);
}

// A point's files are the ones attached to it: they are what its Test Report offers.
function attachFile(p, name) {
  if ((p.files || []).includes(name)) return false;
  p.files = (p.files || []).concat(name);
  return true;
}

// Uploads a file as <campaign>-<card>-<point>-<name> and attaches it to the point.
async function addCardFile(p, file) {
  const st = moduleState.get(p) || {};
  moduleState.set(p, st);
  try {
    const data = await new Promise((ok, no) => {
      const r = new FileReader();
      r.onload = () => ok(String(r.result).split(",")[1] || "");
      r.onerror = () => no(r.error);
      r.readAsDataURL(file);
    });
    const res = await fetch("/add_card_file", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({campaign: pointCampaign() || "XX-000", card: card.id, point: p.seq, name: file.name, data}),
    });
    const r = await res.json();
    st.fileMsg = r.saved ? "" : `Add failed: ${r.error || "unknown error"}`;
    if (r.saved) attachFile(p, r.filename);
  } catch (err) {
    st.fileMsg = `Add failed: ${err}`;
  }
  if (st.fileMsg) st.open = true;   // a failure shows in the module panel
  renderPoints();
}

async function runModule(p, pinned) {
  const st = moduleState.get(p) || {};
  moduleState.set(p, st);
  const name = pinned || (p.module || "").trim();
  if (!name) {
    Object.assign(st, {status: "failed", text: "Enter a module name.", output: ""});
    return refreshModulePanel(p);
  }
  if (!modulesFor(p).includes(name)) {
    Object.assign(st, {status: "failed", output: "",
      text: `${name} isn't registered for this point. Add it to the campaign's Modules table, with a scope that includes it.`});
    return refreshModulePanel(p);
  }
  Object.assign(st, {status: "running", text: "Running...", output: "", saved: "", card: ""});
  refreshModulePanel(p);
  try {
    const res = await fetch("/run_module", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({module: name, card: card.id, point: p.seq, campaign: pointCampaign() || "XX-000", args: p.args || "",
                            params: p.parameters || [],   // for STARFIRE_PARAM_<NAME> and $name
                            signals: pointCampaign() ? (p.signals || "") : "", live: campaignLive(), modules: modulesFor(p),
                            points: cardPoints()}),
    });
    const r = await res.json();
    if (r.status !== "running") return applyRunResult(p, name, r);
    st.run = r.run;
    watchRun(p);
  } catch (err) {
    Object.assign(st, {status: "failed", text: `FAILED: ${err}`, output: ""});
    refreshModulePanel(p);
  }
}

// Every point of the card, for a sequence's run(n) and point parameters.
function cardPoints() {
  const out = {};
  card.points.forEach(q => { out[q.seq] = {module: (q.module || "").trim(), args: q.args || "", params: q.parameters || [],
    signals: pointCampaign() ? (q.signals || "") : "", modules: modulesFor(q)}; });
  return out;
}

// Poll a point's run until it ends, showing its output as it comes.
function watchRun(p) {
  const st = moduleState.get(p);
  if (!st || st.watching) return;
  st.watching = true;
  const tick = async () => {
    try {
      const r = await (await fetch(`/run_status?card=${encodeURIComponent(card.id)}&point=${encodeURIComponent(p.seq)}`)).json();
      if (r.status === "running") {
        const sq = r.sequence;
        Object.assign(st, {status: "running", run: r.run, text: `Running ${r.module}... (${r.seconds} s)${sq && sq.reason ? " | " + sq.reason : ""}`,
                           output: (r.output || "") + (sq && sq.log ? "\nSequence:\n" + sq.log : ""), question: (sq && sq.question) || null});
        refreshModulePanel(p);
        return setTimeout(tick, 1000);
      }
      st.watching = false;
      if (r.result) applyRunResult(p, r.module, r.result);
    } catch (err) {
      setTimeout(tick, 2000);   // the server may be busy; keep trying
    }
  };
  tick();
}

function applyRunResult(p, name, r) {
  const st = moduleState.get(p) || {};
  moduleState.set(p, st);
  const detail = [r.exit_code != null ? `exit ${r.exit_code}` : "", r.seconds != null ? `${r.seconds} s` : ""].filter(Boolean).join(", ");
  st.status = ["complete", "broken"].includes(r.status) ? r.status : "failed";
  st.text = `${st.status.toUpperCase()}${detail ? " (" + detail + ")" : ""}${r.error ? ": " + r.error : ""}`;
  st.output = r.output || "";
  const sig = r.signals || {};
  if ((sig.errors || []).length) st.output += (st.output ? "\n" : "") + "Signals:\n" + sig.errors.join("\n");
  const gone = (sig.deleted || []).length > 0;
  if (gone) {   // superseded: off the point and the live list
    p.files = (p.files || []).filter(n => !sig.deleted.includes(n));
    sig.deleted.forEach(n => setLive(p, n, false));
  }
  if ((sig.stamped || []).length) liveConnected(p, sig.stamped);
  (p.runs ||= {})[name.replace(/\.[^.]*$/, "")] = st.status;
  st.card = r.card || "";   // a test card the run printed: saved for BRANCH / EXTEND
  if (st.card) savePointFile(p, "test", st.card).then(msg => { st.text += ` | ${msg}`; refreshModulePanel(p); });
  if ((r.files || []).map(n => attachFile(p, n)).includes(true) || gone) renderPoints();   // files the run wrote for this point
  refreshModulePanel(p);
  if (measureIsOpen(p)) loadMeasure(card.points.indexOf(p));   // new outputs show in Measure
}

// Runs this page didn't start (a reload mid-run, another tab, a sequence): checked every few seconds.
async function watchCardRuns() {
  try {
    const r = await (await fetch(`/run_status?card=${encodeURIComponent(card.id)}`)).json();
    for (const [seq, j] of Object.entries(r.points || {})) {
      const p = card.points.find(q => String(q.seq) === seq);
      if (!p) continue;
      const st = moduleState.get(p) || {};
      moduleState.set(p, st);
      if (j.status === "waiting" && st.status !== "waiting") {   // a sequence is holding this run until RUN is pressed
        Object.assign(st, {status: "waiting", text: `Waiting for RUN (${j.module})`, output: ""});
        st.open = true; renderPoints();
      } else if (j.status === "running" && !st.watching) { st.open = true; renderPoints(); watchRun(p); }
    }
    for (const p of card.points) {   // no longer waiting: RUN was pressed, or the sequence ended
      const st = moduleState.get(p);
      if (st && st.status === "waiting" && (r.points || {})[String(p.seq)]?.status !== "waiting") {
        Object.assign(st, {status: "", text: ""});
        refreshModulePanel(p);
      }
    }
  } catch (err) { /* try again next time */ }
  setTimeout(watchCardRuns, 3000);
}
setTimeout(watchCardRuns, 500);

// The .test file a point's BRANCH / EXTEND use: the last one attached.
function feedFile(p) { return (p.files || []).filter(n => n.endsWith(".test")).pop() || ""; }

async function feedCard(i, mode) {
  const p = card.points[i], file = feedFile(p);
  if (!file) return;
  try {
    const res = await fetch("/feed_card", {method: "POST", body: JSON.stringify({mode, card, point: p.seq, file, campaign: pointCampaign() || "XX-000", used: campaignTestIds()})});
    const r = await res.json();
    if (!res.ok) throw new Error(r.error || res.status);
    if (mode === "extend") {
      card.points = normalizeCard(r.card).points;
      return renderPoints();
    }
    if (window.parent !== window && window.parent.addTestRow) {
      window.parent.addTestRow(r);
      window.parent.openTestTab(r.id, r.title);
    } else {
      window.open("/test?load=" + encodeURIComponent(r.id + ".test"), "_blank");
    }
  } catch (err) {
    document.getElementById("pt-feed-msg-" + i).textContent = `${mode.toUpperCase()} failed: ${err.message || err}`;
  }
}

async function breakModule(p) {
  const st = moduleState.get(p) || {};
  try {
    const res = await fetch("/break_module", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({card: card.id, point: p.seq}),
    });
    const r = await res.json();
    if (!r.success) { st.text = r.error || "Break failed"; refreshModulePanel(p); }
  } catch (err) {
    st.text = `Break failed: ${err}`;
    refreshModulePanel(p);
  }
}

// Test IDs in the campaign's tables, so BRANCH doesn't reuse one whose .test file is gone.
function campaignTestIds() {
  try { return (window.parent !== window && window.parent.getCampaignTestIds) ? window.parent.getCampaignTestIds() : []; } catch (e) { return []; }
}

function pointCampaign() {
  try { return (window.parent !== window && window.parent.getCampaignId) ? window.parent.getCampaignId() : ""; } catch (e) { return ""; }
}

// <campaign>-<card>-<point>.<ext>, as the server will name it.
function pointFileName(p, ext) {
  const part = s => String(s || "").trim().replace(/[^A-Za-z0-9._-]/g, "_");
  return `${part(pointCampaign()) || "XX-000"}-${part(card.id) || "TC"}-${p.seq}.${ext}`;
}

// Saves text next to the .test files; returns the line to show.
async function savePointFile(p, ext, content) {
  try {
    const res = await fetch("/save_point_file", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({campaign: pointCampaign() || "XX-000", card: card.id, point: p.seq, ext, content}),
    });
    const r = await res.json();
    if (r.saved) { attachFile(p, r.filename); renderPoints(); }
    return r.saved ? `Saved ${r.filename}` : `Save failed: ${r.error || "unknown error"}`;
  } catch (err) {
    return `Save failed: ${err}`;
  }
}

function renderPoints() {

    div.innerHTML = `
      <div class="pt-head">

        ${locked ? '<span class="lock-tag">🔒 locked</span>' : ""}
        <div class="pt-btns">
          <button class="btn mini btn-icon flag-btn${flagged ? " flagged" : ""}" data-act="flag" data-i="${i}" title="flag">${ICON_FLAG}</button>
          <button class="btn mini btn-icon" data-act="preview" data-i="${i}" title="camera preview">${ICON_PHOTO_CAMERA}</button>
          <button class="btn mini btn-icon" data-act="capture" data-i="${i}" title="capture image">${ICON_ADD_A_PHOTO}</button>
          <button class="btn mini btn-icon measure-toggle" data-act="measure" data-i="${i}" title="measure">${ICON_SPEED}</button>
          <button class="btn mini btn-icon module-toggle" data-act="module" data-i="${i}" title="activate (run a module)">${ICON_BOLT}</button>
          <button class="btn mini btn-icon calc-toggle" data-act="calc" data-i="${i}" title="calculator (math and metrics on this point's csv)">${ICON_CALC}</button>
          <button class="btn mini btn-icon" data-act="addfile" data-i="${i}" title="add a file to this test card">${ICON_ADD}</button>
          ${showJiraBtn ? `<button class="btn mini btn-icon" data-act="jira" data-i="${i}" title="create Jira ticket">${ICON_BOOKMARK_ADD}</button>` : ""}
          <span class="pt-btn-gap"></span>
          <button class="btn mini btn-icon" data-act="dup" data-i="${i}" title="duplicate as the next point">${ICON_CONTENT_COPY}</button>
          <button class="btn mini btn-icon" data-act="up" data-i="${i}" title="move up">${ICON_ARROW_UPWARD}</button>
          <button class="btn mini btn-icon" data-act="down" data-i="${i}" title="move down">${ICON_ARROW_DOWNWARD}</button>
          <button class="btn mini btn-icon btn-x" data-act="del" data-i="${i}" ${dis} title="delete point">${ICON_CLOSE}</button>
        </div>
      </div>
      <div class="pt-main">
        <div><label>Action</label><textarea data-i="${i}" data-f="action" ${dis}>${esc(p.action)}</textarea></div>
        <div><label>Expected Result</label><textarea data-i="${i}" data-f="expected" ${dis}>${esc(p.expected)}</textarea></div>
        <div><label>Observed Result</label><textarea data-i="${i}" data-f="observed">${esc(p.observed)}</textarea></div>
        <div><label>Reference</label><textarea data-i="${i}" data-f="reference" ${dis}>${esc(p.reference)}</textarea></div>
      </div>
      <div class="pt-sign">
        <div><label>Responsible Party</label><input data-i="${i}" data-f="responsible_party" value="${esc(p.responsible_party)}" ${dis}></div>
        <div><label>Date</label><input data-i="${i}" data-f="date" value="${esc(p.date)}"></div>
        <div><label>Time (24h)</label>
          <div class="time-row">
            <input data-i="${i}" data-f="time" value="${esc(p.time)}">
            <button class="btn mini" data-now="${i}">now</button>
          </div>
        </div>
        <div><label>Initial</label><input data-i="${i}" data-f="initial" value="${esc(p.initial)}"></div>
        <div><label>Quality</label>${qualitySelect(i, p.quality)}</div>
      </div>
      <div class="pt-expand-row">
        <div class="pt-camera" id="pt-camera-${i}"></div>
        <div class="pt-measure" id="pt-measure-${i}">${measurePanelHtml(i, p)}</div>
        <div class="pt-module" id="pt-module-${i}">${moduleIsOpen(p) ? modulePanelHtml(i, p) : ""}</div>
      </div>
      <div class="pt-calc" id="pt-calc-${i}">${calcIsOpen(p) ? calcPanelHtml(i, p) : ""}</div>
      <div class="pt-images" id="pt-images-${i}">${imgChips}${fileChips}</div>
      <div class="pt-cam-msg" id="pt-cam-msg-${i}"></div>
      <div class="pt-cam-msg" id="pt-jira-msg-${i}"></div>
      <div class="pt-cam-msg" id="pt-feed-msg-${i}"></div>
      <div class="pt-feed">
        <div class="pt-pins" id="pt-pins-${i}">${pinsHtml(i, p)}</div>
        <button class="btn mini btn-icon" data-act="branch" data-i="${i}" ${feed ? "" : "disabled"} title="branch: a new card up to this point, then the points of a module's .test file">${ICON_BRANCH}</button>
        <button class="btn mini btn-icon" data-act="extend" data-i="${i}" ${feed && last ? "" : "disabled"} title="extend: add the points of a module's .test file after this last point">${ICON_EXTEND}</button>
      </div>`;
    list.appendChild(div);
  });
  reattachPreviewIfOpen();
  card.points.forEach(p => refreshPins(p));
  list.querySelectorAll("input[data-f], textarea[data-f], select[data-f]").forEach(el => {
    el.addEventListener("input", () => {
      card.points[+el.dataset.i][el.dataset.f] = el.value;
    });
  });
  list.querySelectorAll("select[data-f]").forEach(el => {
    el.addEventListener("change", () => {
      card.points[+el.dataset.i][el.dataset.f] = el.value;
      // Quality change needs a re-render: the Jira ticket button's
      // visibility is derived from it, not just displayed.
      if (el.dataset.f === "quality") renderPoints();
    });
  });
  list.querySelectorAll("button[data-act]").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = +btn.dataset.i, act = btn.dataset.act;
      if (act === "del") {
        if (card.points[i].locked) return;   // locked points can't be removed
        card.points.splice(i, 1);
      }
      if (act === "dup") duplicatePoint(i);
      if (act === "up" && i > 0) [card.points[i-1], card.points[i]] = [card.points[i], card.points[i-1]];
      if (act === "down" && i < card.points.length - 1) [card.points[i+1], card.points[i]] = [card.points[i], card.points[i+1]];
      if (act === "flag") {
        card.points[i].flagged = !card.points[i].flagged;   // works regardless of locked
      }
      if (act === "capture") { capturePointImage(i); return; }
      if (act === "preview") { togglePreview(i); return; }
      if (act === "jira") { createJiraTicket(i); return; }
      if (act === "branch" || act === "extend") { feedCard(i, act); return; }
      if (act === "measure") { toggleMeasure(i); return; }
      if (act === "addfile") {
        const inp = document.createElement("input");
        inp.type = "file";
        inp.addEventListener("change", () => { if (inp.files[0]) addCardFile(card.points[i], inp.files[0]); });
        inp.click();
        return;
      }
      if (act === "calc") {
        const st = calcState.get(card.points[i]) || {exprs: [""]};
        st.open = !st.open;
        calcState.set(card.points[i], st);
      }
      if (act === "module") {
        const st = moduleState.get(card.points[i]) || {};
        st.open = !st.open;
        moduleState.set(card.points[i], st);
      }
      renderPoints();
    });
  });
  card.points.forEach((_, i) => { bindModulePanel(i); bindCalcPanel(i); bindMeasurePanel(i); });
  list.querySelectorAll("button[data-rm-img]").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = +btn.dataset.i, fn = btn.dataset.rmImg;
      // Detaches the filename from this point only -- the .jpg file
      // itself is left on disk, not deleted.
      card.points[i].images = (card.points[i].images || []).filter(x => x !== fn);
      renderPoints();
    });
  });
  list.querySelectorAll("button[data-rm-file]").forEach(btn => {
    btn.addEventListener("click", () => {
      // Detaches the file from this point (and its report); it stays on disk.
      const i = +btn.dataset.i, fn = btn.dataset.rmFile;
      card.points[i].files = (card.points[i].files || []).filter(x => x !== fn);
      setLive(card.points[i], fn, false);
      renderPoints();
    });
  });
  list.querySelectorAll("input[data-live]").forEach(box => {
    box.addEventListener("change", () => tickLive(card.points[+box.dataset.i], box.dataset.live, box.checked));
  });
  list.querySelectorAll("button[data-now]").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = +btn.dataset.now, d = new Date(), pad = n => String(n).padStart(2, "0");
      card.points[i].date = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
      card.points[i].time = `${pad(d.getHours())}:${pad(d.getMinutes())}`;   // 24h
      renderPoints();
    });
  });
}

function esc(s) { return (s??"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

document.getElementById("addPointBtn").addEventListener("click", () => {
  card.points.push({seq: nextSeq(), action:"", expected:"", observed:"", reference:"",
                     responsible_party:"", date:"", time:"", initial:"", quality:"",
                     locked: false, flagged: false, images: [], files: [],
                     parameters: [], signals: "", runs: {}, module: "", args: ""});
  renderPoints();
});

function renderNomenclature() {
  const t = document.getElementById("nomTable");
  t.querySelectorAll("tr.nomrow").forEach(r => r.remove());
  card.nomenclature.forEach(([sym, defn, units, locked], i) => {
    const dis = locked ? "disabled" : "";
    const tr = document.createElement("tr");
    tr.className = "nomrow";
    tr.innerHTML = `
      <td><input value="${esc(sym)}" data-i="${i}" data-f="0" placeholder="\\alpha" ${dis}></td>
      <td><input value="${esc(defn)}" data-i="${i}" data-f="1" placeholder="definition" ${dis}></td>
      <td><input value="${esc(units||"")}" data-i="${i}" data-f="2" placeholder="units" ${dis}></td>
      <td><button class="btn mini btn-x" data-del="${i}" ${dis}>x</button></td>`;
    t.appendChild(tr);
  });
  t.querySelectorAll("input[data-i]").forEach(inp => {
    inp.addEventListener("input", () => {
      card.nomenclature[+inp.dataset.i][+inp.dataset.f] = inp.value;
    });
  });
  t.querySelectorAll("button[data-del]").forEach(btn => {
    btn.addEventListener("click", () => {
      if (card.nomenclature[+btn.dataset.del][3]) return;   // locked row
      card.nomenclature.splice(+btn.dataset.del, 1);
      renderNomenclature();
    });
  });
}
document.getElementById("addNomBtn").addEventListener("click", () => {
  card.nomenclature.push(["", "", "", false]);
  renderNomenclature();
});

function renderReferences() {
  const t = document.getElementById("refTable");
  t.querySelectorAll("tr.refrow").forEach(r => r.remove());
  card.references.forEach(([ref, desc, locked], i) => {
    const dis = locked ? "disabled" : "";
    const tr = document.createElement("tr");
    tr.className = "refrow";
    tr.innerHTML = `
      <td><input value="${esc(ref)}" data-i="${i}" data-f="0" placeholder="REQ-1234" ${dis}></td>
      <td><input value="${esc(desc)}" data-i="${i}" data-f="1" placeholder="description" ${dis}></td>
      <td><button class="btn mini btn-x" data-del="${i}" ${dis}>x</button></td>`;
    t.appendChild(tr);
  });
  t.querySelectorAll("input[data-i]").forEach(inp => {
    inp.addEventListener("input", () => {
      card.references[+inp.dataset.i][+inp.dataset.f] = inp.value;
    });
  });
  t.querySelectorAll("button[data-del]").forEach(btn => {
    btn.addEventListener("click", () => {
      if (card.references[+btn.dataset.del][2]) return;   // locked row
      card.references.splice(+btn.dataset.del, 1);
      renderReferences();
    });
  });
}
document.getElementById("addRefBtn").addEventListener("click", () => {
  card.references.push(["", "", false]);
  renderReferences();
});

function renderTextList(listId, key) {
  const el = document.getElementById(listId);
  el.innerHTML = "";
  card[key].forEach(([val, locked], i) => {
    const dis = locked ? "disabled" : "";
    const row = document.createElement("div");
    row.className = "list-row";
    row.innerHTML = `<textarea data-key="${key}" data-i="${i}" ${dis}>${esc(val)}</textarea>
      <button class="btn mini btn-x" data-key="${key}" data-del="${i}" ${dis}>x</button>`;
    el.appendChild(row);
  });
  el.querySelectorAll("textarea[data-key]").forEach(ta => {
    ta.addEventListener("input", () => { card[ta.dataset.key][+ta.dataset.i][0] = ta.value; });
  });
  el.querySelectorAll("button[data-del]").forEach(btn => {
    btn.addEventListener("click", () => {
      if (card[btn.dataset.key][+btn.dataset.del][1]) return;   // locked row
      card[btn.dataset.key].splice(+btn.dataset.del, 1);
      renderTextList(listId, btn.dataset.key);
    });
  });
}
document.getElementById("addNoteBtn").addEventListener("click", () => {
  card.notes.push(["", false]); renderTextList("notesList", "notes");
});
document.getElementById("addWarningBtn").addEventListener("click", () => {
  card.warnings.push(["", false]); renderTextList("warningsList", "warnings");
});

function download(filename, blobOrText, mime) {
  const blob = blobOrText instanceof Blob ? blobOrText : new Blob([blobOrText], {type: mime || "text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}

function freezeCurrentCard() {
  card.locked = true;
  card.points.forEach(p => { p.locked = true; });
  card.nomenclature.forEach(row => { row[3] = true; });
  card.references.forEach(row => { row[2] = true; });
  card.notes.forEach(row => { row[1] = true; });
  card.warnings.forEach(row => { row[1] = true; });
}
function unfreezeCard() {
  card.locked = false;
  card.points.forEach(p => { p.locked = false; });
  card.nomenclature.forEach(row => { row[3] = false; });
  card.references.forEach(row => { row[2] = false; });
  card.notes.forEach(row => { row[1] = false; });
  card.warnings.forEach(row => { row[1] = false; });
}
function rerenderAll() {
  bindMeta(); renderPoints(); renderNomenclature(); renderReferences();
  renderTextList("notesList", "notes"); renderTextList("warningsList", "warnings");
}
async function saveCard(statusEl) {
  statusEl.textContent = "saving...";
  try {
    const res = await fetch("/save", {method: "POST", body: JSON.stringify(card)});
    const data = await res.json();
    statusEl.textContent = data.saved ? `Saved to ${data.path}` : `Save failed: ${data.error || "unknown error"}`;
  } catch (err) {
    statusEl.textContent = `Save failed: ${err}`;
  }
}
document.getElementById("saveLockedBtn").addEventListener("click", () => {
  // Locking is a workflow marker, not security. Freezing happens
  // client-side so the editor reflects it immediately, not just the file.
  freezeCurrentCard();
  rerenderAll();
  saveCard(document.getElementById("saveStatus"));
});
document.getElementById("saveUnlockedBtn").addEventListener("click", () => {
  unfreezeCard();
  rerenderAll();
  saveCard(document.getElementById("saveStatus"));
});
document.getElementById("loadJsonBtn").addEventListener("click", () => {
  document.getElementById("loadJsonFile").click();
});
function normalizePairList(items, width) {
  // Pads each row to `width` (the last element the locked flag); accepts
  // a bare string for a single-element row (pre-locking notes/warnings).
  return (items || []).map(item => {
    let row = typeof item === "string" ? [item] : item.slice();
    while (row.length < width - 1) row.push("");
    if (row.length < width) row.push(false);
    return row.slice(0, width);
  });
}
function normalizeCard(c) {
  c.nomenclature = normalizePairList(c.nomenclature, 4);
  c.references = normalizePairList(c.references, 3);
  c.notes = normalizePairList(c.notes, 2);
  c.warnings = normalizePairList(c.warnings, 2);
  if (!c.quality_assurance) c.quality_assurance = "";
  if (!c.requirements) c.requirements = "";
  if (!c.locked) c.locked = false;
  if (!c.files_migrated) c.files_migrated = false;
  (c.points || []).forEach(p => {
    if (!("locked" in p)) p.locked = false;
    if (!("flagged" in p)) p.flagged = false;
    if (!p.images) p.images = [];
    if (!p.files) p.files = [];
    if (!("observed" in p)) p.observed = "";
    delete p.usb_port; delete p.measure_command; delete p.measurements;   // retired Measure fields
    if (!p.parameters) p.parameters = [];
    if (typeof p.signals !== "string") p.signals = "";
    delete p.autorun;   // retired: sequences always wait for RUN
    if (!p.runs || typeof p.runs !== "object") p.runs = {};   // module stem -> last run status
    if (typeof p.module !== "string") p.module = "";
    if (typeof p.args !== "string") p.args = "";
  });
  return c;
}
function loadCardIntoUI(c) {
  card = normalizeCard(c);
  portMap = null;
  bindMeta(); renderPoints(); renderNomenclature(); renderReferences();
  renderTextList("notesList", "notes"); renderTextList("warningsList", "warnings");
}
document.getElementById("loadJsonFile").addEventListener("change", (e) => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(txt => loadCardIntoUI(JSON.parse(txt)));
});

async function postExport(path, filename, mime) {
  // Open the print window synchronously, before the await below -- many
  // popup blockers kill a window.open() called after a fetch() resolves.
  let w = null;
  if (path === "/export/print") {
    w = window.open("", "_blank");
    if (w) w.document.write("Generating...");
  }
  try {
    const res = await fetch(path, {method: "POST", body: JSON.stringify(card)});
    if (!res.ok) throw new Error(`server returned ${res.status}`);
    const text = await res.text();
    if (path === "/export/print") {
      if (w) { w.document.open(); w.document.write(text); w.document.close(); }
    } else {
      download(filename, text, mime);
    }
  } catch (err) {
    if (w) { w.document.open(); w.document.write("Failed to generate: " + err); w.document.close(); }
    document.getElementById("saveStatus").textContent = `Export failed: ${err}`;
  }
}
document.getElementById("exportCsvBtn").addEventListener("click", () =>
  postExport("/export/csv", (card.id || "card") + ".csv", "text/csv"));
document.getElementById("exportPrintBtn").addEventListener("click", () =>
  postExport("/export/print"));
document.getElementById("exportDocxBtn").addEventListener("click", async () => {
  try {
    const res = await fetch("/export/test/docx", {method: "POST", body: JSON.stringify(card)});
    if (!res.ok) throw new Error(`server returned ${res.status}`);
    download((card.id || "test") + ".docx", await res.blob());
  } catch (err) {
    document.getElementById("saveStatus").textContent = `Docx export failed: ${err}`;
  }
});

bindMeta();
card.points = [{seq:10, action:"", expected:"", observed:"", reference:"",
                responsible_party:"", date:"", time:"", initial:"", quality:"",
                locked:false, flagged:false, images:[], files:[],
                parameters:[], signals:"", runs:{}, module:"", args:""}];
renderPoints();
renderNomenclature();
renderReferences();
renderTextList("notesList", "notes");
renderTextList("warningsList", "warnings");

// If opened as ?load=<filename>, fetch that .test file and populate the
// editor with it -- how the campaign page opens a specific test in a tab.
const _loadFile = new URLSearchParams(window.location.search).get("load");
if (_loadFile) {
  fetch("/load?file=" + encodeURIComponent(_loadFile))
    .then(r => { if (!r.ok) throw new Error("not found"); return r.json(); })
    .then(c => { loadCardIntoUI(c); return attachExistingFiles(); })
    .catch(() => { document.getElementById("m-id").value = _loadFile.replace(/\.test$/, ""); });
}

// One-off for cards saved before points owned their files: attach the files already named for each point.
async function attachExistingFiles() {
  if (card.files_migrated) return;
  const q = new URLSearchParams({campaign: pointCampaign() || "XX-000", card: card.id});
  const found = (await (await fetch("/point_files?" + q)).json()).files || {};
  card.points.forEach(p => (found[p.seq] || []).forEach(f => attachFile(p, f.name)));
  card.files_migrated = true;
  renderPoints();
}

// Lets an embedding page (the campaign tab bar) read the live editor
// state, since `card` is a module-scope `let` otherwise unreachable from an iframe.
window.getCard = () => card;

// The card as it is now, for its System (system.html reads this from its opener or the campaign page).
window.systemInput = () => ({card: JSON.parse(JSON.stringify(card)), campaign: pointCampaign() || "XX-000", live: campaignLive()});

// Only inside a campaign: the card's System, in an SY tab if the campaign page has them, else its own window.
if (pointCampaign() && SIGNET_AVAILABLE) {
  const sysBtn = document.getElementById("buildSystemBtn");
  sysBtn.style.display = "";
  sysBtn.addEventListener("click", () => {
    if (window.parent !== window && window.parent.openSystemTab) return window.parent.openSystemTab(card.id);
    window.open(`/system?card=${encodeURIComponent(card.id)}&campaign=${encodeURIComponent(pointCampaign())}`, "_blank");
  });
}

// Only inside a campaign tab: ask the campaign page to open this card's Test Report tab.
if (window.self !== window.top && window.parent.openReportTab) {
  const buildBtn = document.getElementById("buildReportBtn");
  buildBtn.style.display = "";
  buildBtn.addEventListener("click", () => {
    const file = new URLSearchParams(location.search).get("load") || "";
    window.parent.openReportTab(file.replace(/\.test$/, "") || card.id);
  });
}
</script>
