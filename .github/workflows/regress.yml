# regress.yml: Starfire regression suite (tests/regress.py) on Linux and Windows, from source and as a built binary
name: regress

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  regress:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install python-docx numpy

      - name: Regress (source)
        run: python tests/regress.py starfire.py

      - name: Build (starfi.sh)
        if: runner.os == 'Linux'
        run: bash starfi.sh --build
      - name: Build (starfire.ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./starfire.ps1 -Build

      - name: Regress (binary)
        shell: bash
        run: python tests/regress.py dist/starfire${{ runner.os == 'Windows' && '.exe' || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: starfire-${{ matrix.os }}
          path: dist/starfire*
          if-no-files-found: ignore
