# Cargo.toml:     STARFIRE RUST MODULES (hotfire, tvac)
# AUTHOR:         DANIEL DESAI
# UPDATED:        2026-10-25
# VERSION:        4.0.0
#
# src/bin/hotfire.rs, src/bin/tvac.rs and the signal helper src/bin/signet.rs.
# cargo build --release, then copy target/release/hotfire and tvac into dist/.

[package]
name = "starfire-modules"
version = "4.0.0"
edition = "2024"
autobins = false   # src/bin/signet.rs is the signal helper, not a program

[[bin]]
name = "hotfire"
path = "src/bin/hotfire.rs"

[[bin]]
name = "tvac"
path = "src/bin/tvac.rs"

[dependencies]
eframe = "0.37"
egui_plot = "0.38"
epaint_default_fonts = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "ab_glyph", "line_series"] }
signal-hook = "0.4"